name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./marketplace-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn -B clean install
        
      - name: Run Tests & Generate Coverage Report
        run: mvn verify
        
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            marketplace-backend/**/target/site/jacoco/
            marketplace-backend/target/site/jacoco-aggregate/

      - name: Check Jacoco Coverage File
        if: always()
        run: |
          if [ ! -f ./target/jacoco.exec ]; then
            echo "❌ Jacoco execution data file not generated!"
            exit 1
          else
            echo "✅ Jacoco execution data file is present."
          fi


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  project-check:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Project check failed"
            exit 1
          fi
          echo "✅ All checks passed successfully!"