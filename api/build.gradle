import javax.xml.parsers.SAXParserFactory

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'jacoco'
}

group = 'com.marketplace'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	developmentOnly
	runtimeClasspath {
		extendsFrom developmentOnly
	}
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JWT
	implementation 'io.jsonwebtoken:jjwt:0.12.6'

	// Database
	implementation 'org.postgresql:postgresql'

	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.2'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Development tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = "0.8.12"
	reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = false
		html.required = true
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					'com/marketplace/configuration/**',
					'com/marketplace/model/**',
					'com/marketplace/dto/**',
					'com/marketplace/entity/**',
					'com/marketplace/exception/**',
			])
		}))
	}
}

task printCoverageReport(type: Task, dependsOn: jacocoTestReport) {
	doLast {
		def reportFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile

		if (reportFile.exists()) {
			try {
				// Configuration sécurisée du parseur XML
				def xmlParser = javax.xml.parsers.SAXParserFactory.newInstance()
				xmlParser.setValidating(false)
				xmlParser.setNamespaceAware(true)
				xmlParser.setFeature("http://apache.org/xml/features/nonvalidating/load-dtd-grammar", false)
				xmlParser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)

				def report = new XmlParser(xmlParser.newSAXParser()).parse(reportFile)

				println "\n========== Rapport de Couverture de Tests =========="

				// Calculer les totaux globaux
				def counters = [:]
				report.counter.each { counter ->
					def type = counter.'@type'
					def covered = counter.'@covered'.toInteger()
					def missed = counter.'@missed'.toInteger()
					def total = covered + missed
					def percentage = total > 0 ? (covered * 100.0 / total).round(2) : 0

					counters[type] = [
							covered: covered,
							missed: missed,
							total: total,
							percentage: percentage
					]
				}

				// Afficher les totaux
				counters.each { type, data ->
					println String.format("%-12s: %6.2f%% (%d/%d)",
							type,
							data.percentage,
							data.covered,
							data.total
					)
				}

				// Afficher les détails par package
				println "\nDétail par package :"
				println "-----------------"
				report.package.each { pkg ->
					def pkgName = pkg.'@name'
					def lineCounter = pkg.counter.find { it.'@type' == 'LINE' }
					if (lineCounter) {
						def covered = lineCounter.'@covered'.toInteger()
						def missed = lineCounter.'@missed'.toInteger()
						def total = covered + missed
						def percentage = total > 0 ? (covered * 100.0 / total).round(2) : 0

						println String.format("%-40s: %6.2f%% (%d/%d)",
								pkgName,
								percentage,
								covered,
								total
						)
					}
				}

				println "\n================================================"

			} catch (Exception e) {
				println "Erreur lors de la lecture du rapport : ${e.message}"
				println "Chemin du fichier : ${reportFile.absolutePath}"
				e.printStackTrace()
			}
		} else {
			println "Rapport non trouvé : ${reportFile.absolutePath}"
			println "Assurez-vous d'avoir exécuté les tests avec succès."
		}
	}
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.5
			}
		}
	}
}

jacocoTestReport.dependsOn test
check.dependsOn jacocoTestReport
jacocoTestReport.finalizedBy printCoverageReport
