import javax.xml.parsers.DocumentBuilderFactory

jacoco {
    toolVersion = "0.8.12"
    reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

// Define common package exclusions for JaCoCo
def jacocoExcludes = [
        'com/marketplace/configuration/**',
        'com/marketplace/model/**',
        'com/marketplace/dto/**',
        'com/marketplace/entity/**',
        'com/marketplace/exception/**'
]
def jacocoExcludesForVerification = jacocoExcludes.collect { it.replace('/**', '.*') }

/**
 * JaCoCo test coverage verification configuration.
 * This configuration defines the rules that must be met for the build to be considered successful.
 */
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.7
            }

            excludes = jacocoExcludesForVerification
        }
    }
}

/**
 * Configuration for generating JaCoCo test coverage reports.
 * This task generates detailed reports showing which parts of the code are covered by tests.
 */
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { File file ->
            fileTree(dir: file, exclude: jacocoExcludes)
        }))
    }
}

/**
 * Custom task to print JaCoCo coverage report in the console.
 * This task provides a quick overview of test coverage statistics including:
 * - Global coverage metrics (INSTRUCTION, LINE, BRANCH, etc.)
 * - Detailed coverage breakdown by package
 *
 * The task depends on jacocoTestReport to ensure coverage data is up to date.
 * It reads the XML report generated by JaCoCo and formats the data for easy reading.
 */
tasks.register('printCoverageReport', Task) {
    dependsOn jacocoTestReport
    doLast {
        def reportFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile

        if (reportFile.exists()) {
            try {
                def dbFactory = DocumentBuilderFactory.newInstance()
                dbFactory.setValidating(false)
                dbFactory.setNamespaceAware(true)
                dbFactory.setFeature("http://apache.org/xml/features/nonvalidating/load-dtd-grammar", false)
                dbFactory.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)

                def dBuilder = dbFactory.newDocumentBuilder()
                def doc = dBuilder.parse(reportFile)
                doc.getDocumentElement().normalize()

                println "\n========== Test Coverage Report =========="

                // Calculate global totals
                def counters = [:]
                doc.getElementsByTagName("counter").each { counter ->
                    def type = counter.getAttribute("type")
                    def covered = counter.getAttribute("covered").toInteger()
                    def missed = counter.getAttribute("missed").toInteger()
                    def total = covered + missed
                    def percentage = total > 0 ? (covered * 100.0 / total).round(2) : 0

                    counters[type] = [
                            covered   : covered,
                            missed    : missed,
                            total     : total,
                            percentage: percentage
                    ]
                }

                // Print global coverage metrics
                counters.each { type, data ->
                    println String.format("%-12s: %6.2f%% (%d/%d)",
                            type,
                            data.percentage,
                            data.covered,
                            data.total
                    )
                }

                // Details by package
                println "\nPackage details :"
                println "-----------------"
                doc.getElementsByTagName("package").each { pkg ->
                    def pkgName = pkg.getAttribute("name")
                    def lineCounters = pkg.getElementsByTagName("counter")
                    def lineCounter = null

                    for (int i = 0; i < lineCounters.getLength(); i++) {
                        if (lineCounters.item(i).getAttribute("type") == "LINE") {
                            lineCounter = lineCounters.item(i)
                            break
                        }
                    }

                    if (lineCounter) {
                        def covered = lineCounter.getAttribute("covered").toInteger()
                        def missed = lineCounter.getAttribute("missed").toInteger()
                        def total = covered + missed
                        def percentage = total > 0 ? (covered * 100.0 / total).round(2) : 0

                        println String.format("%-40s: %6.2f%% (%d/%d)",
                                pkgName,
                                percentage,
                                covered,
                                total
                        )
                    }
                }

                println "\n================================================"

            } catch (Exception e) {
                println "Erreur lors de la lecture du rapport : ${e.message}"
                println "File path : ${reportFile.absolutePath}"
                e.printStackTrace()
            }
        } else {
            println "Report not found : ${reportFile.absolutePath}"
            println "Make sure tests have been executed successfully."
        }
    }
}


/**
 * Custom task to open the JaCoCo HTML report in the default browser.
 * This task provides easy access to the detailed HTML coverage report by:
 * - Checking if the report exists
 * - Detecting the operating system
 * - Using the appropriate system command to open the default browser
 *
 * The task depends on jacocoTestReport to ensure the HTML report is generated.
 * It supports Windows, macOS, and Linux operating systems.
 */
tasks.register('openJacocoReport', Task) {
    dependsOn jacocoTestReport
    group = 'Reporting'
    description = 'Opens the JaCoCo coverage report in the default browser'

    doLast {
        def reportFile = layout.buildDirectory.file('reports/jacoco/html/index.html').get().asFile

        if (reportFile.exists()) {
            def osName = System.getProperty('os.name').toLowerCase()
            try {
                if (osName.contains('windows')) {
                    exec { commandLine 'cmd', '/c', "start ${reportFile.absolutePath}" }
                } else if (osName.contains('mac')) {
                    exec { commandLine 'open', reportFile.absolutePath }
                } else if (osName.contains('linux')) {
                    exec { commandLine 'xdg-open', reportFile.absolutePath }
                } else {
                    logger.warn "Unrecognized operating system. Please open the report manually: ${reportFile.absolutePath}"
                }
                println "\nReport opened in browser : ${reportFile.absolutePath}"
            } catch (Exception e) {
                println "\nUnable to open report automatically. You can open it manually here :"
                println reportFile.absolutePath
                println "\nError : ${e.message}"
            }
        } else {
            println "\nReport does not exist. Make sure tests have been executed."
            println "Expected path : ${reportFile.absolutePath}"
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport.dependsOn test
check.dependsOn jacocoTestReport
jacocoTestReport.finalizedBy printCoverageReport