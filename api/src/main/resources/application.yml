spring:
  application:
    name: marketplace_backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  devtools:
    restart:
      enabled: true
    remote:
      secret: mysecret
    livereload:
      enabled: true

  profiles:
    default: dev

  springdoc:
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true

server:
  servlet:
    context-path: /api/v1/

