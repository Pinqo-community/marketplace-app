services:
  backend:
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: >
      /bin/sh -c "./gradlew clean build --refresh-dependencies && ./gradlew bootRun"
    ports:
      - "8080:8080"
    container_name: marketplace-backend
    volumes:
      - ./api:/app:cached
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    environment:
      VITE_BACKEND_URL: http://localhost:8080
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    container_name: marketplace-frontend
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - type: bind
        source: ./client
        target: /app
      - type: volume
        target: /app/node_modules

  backend-tests:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: marketplace-backend-tests
    command: >
      /bin/sh -c "./gradlew clean test --refresh-dependencies"
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - ./api:/app:cached
      - gradle-cache:/home/gradle/.gradle

  db:
    image: postgres:15
    container_name: marketplace-database
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  gradle-cache:
  postgres_data:

networks:
  app-network:
    driver: bridge
