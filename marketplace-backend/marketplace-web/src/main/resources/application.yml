spring:
  application:
    name: marketplace-web

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET_CLIENT}
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_SECRET_CLIENT}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  devtools:
    restart:
      enabled: true
    remote:
      secret: mysecret
    livereload:
      enabled: true

  profiles:
    default: dev

  springdoc:
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api/v1/

app:
  security:
    access-token:
      secret-key: ${JWT_SECRET}
      access-token-expiration: 900000 #15mins
      refresh-token-expiration: 86400000 #1day