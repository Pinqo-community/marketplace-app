spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  # Configuration RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Configuration Mail
  mail:
    from: test@email.com
    host: smtp.gmail.com  # ou localhost pour les tests
    port: 587            # ou 25 pour les tests
    username: test       # valeur fixe pour les tests
    password: test       # valeur fixe pour les tests
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  cloud:
    aws:
      s3:
        endpoint: http://localhost:9000
        path-style-access-enabled: true
      credentials:
        access-key: minioadmin
        secret-key: minioadmin
      region:
        static: us-east-1
      stack:
        auto: false

app:
  client:
    allowed-urls: "http://localhost:8080"
  security:
    access-token:
      secret-key: 464544554545454542424242TESTINGKEY424242424242424242424242
      expiration: 86400000  # 24 heures en millisecondes
    refresh-token:
      secret-key: 797979797979797979797979TESTINGKEY797979797979797979797979
      expiration: 604800000

  storage:
    bucket-name: test-bucket