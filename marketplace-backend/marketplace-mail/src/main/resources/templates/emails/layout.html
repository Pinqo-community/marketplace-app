<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptoir Local</title>
    <style th:replace="~{emails/fragments/styles :: styles}"></style>
</head>
<body>
<div class="email-container">
    <!-- Header commun -->
    <header class="header" th:replace="~{emails/fragments/header :: header}">
    </header>

    <!-- Contenu spécifique -->
    <main class="content">
        <div th:replace="~{${contentTemplate} :: content}">
            <!-- Le contenu sera injecté ici -->
        </div>
    </main>

    <!-- Footer commun -->
    <footer class="footer" th:replace="~{emails/fragments/footer :: footer}">
    </footer>
</div>
</body>
</html>
